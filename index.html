<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konpob</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-layout">
        <div class="calculator">
            <div class="top-row">
                <input id="display" type="text" value="" readonly>
                <button onclick="clearDisplay()">C</button>
            </div>

            <div class="buttons-grid">
                <button onclick="btn('1')">1</button> 
                <button onclick="btn('2')">2</button> 
                <button onclick="btn('3')">3</button> 
                <button onclick="btn('/')">/</button> 
                
                <button onclick="btn('4')">4</button> 
                <button onclick="btn('5')">5</button>
                <button onclick="btn('6')">6</button>
                <button onclick="btn('*')">*</button>

                <button onclick="btn('7')">7</button>
                <button onclick="btn('8')">8</button>
                <button onclick="btn('9')">9</button>
                <button onclick="btn('-')">-</button>

                <button onclick="btn('0')">0</button>
                <button onclick="btn('.')">.</button>
                <button onclick="calculatorNumber()">=</button>
                <button onclick="btn('+')">+</button>
            </div>
        </div>

        <div class="history-panel">
            <h1>History</h1>
            <div id="history" style="margin: 0;"></div>

            <button type="button" onclick="clearhistory()">ClearHistory</button>
        </div>
    </div>


    <script src="script.js" defer></script>
</body>

</html>
